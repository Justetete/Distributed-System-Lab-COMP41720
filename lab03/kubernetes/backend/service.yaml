apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  # ClusterIP type - only accessible within the cluster
  type: ClusterIP
  
  # Select pods with label app: backend
  selector:
    app: backend
  
  ports:
  - name: http
    port: 5000          # Service port
    targetPort: 5000    # Container port
    protocol: TCP
  
  # Session affinity (optional)
  sessionAffinity: None