apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  # Number of pod replicas
  replicas: 1
  
  selector:
    matchLabels:
      app: backend
  
  template:
    metadata:
      labels:
        app: backend
    
    spec:
      containers:
      - name: backend
        image: backend-service:latest
        imagePullPolicy: Never  # Important for Minikube - use local image
        
        ports:
        - containerPort: 5000
          name: http
        
        env:
        # Fault Injection Configuration
        - name: FAULT_INJECTION_ENABLED
          value: "true"
        - name: FAULT_DELAY_RATE
          value: "0.3"  # 30% chance of delay
        - name: FAULT_ERROR_RATE
          value: "0.2"  # 20% chance of error
        - name: FAULT_TIMEOUT_RATE
          value: "0.1"  # 10% chance of timeout
        - name: FAULT_MIN_DELAY
          value: "1.0"  # Minimum delay in seconds
        - name: FAULT_MAX_DELAY
          value: "5.0"  # Maximum delay in seconds
        
        # Resource limits (optional but recommended)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # Health check configuration
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3